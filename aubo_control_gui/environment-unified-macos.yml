# Separate environment so the validated arm-only runtime remains available.
name: aubo-unified-ros-lyrical
channels:
  - https://prefix.dev/robostack-lyrical
  - conda-forge
dependencies:
  - python>=3.14,<3.15
  - ros-lyrical-rclpy
  - ros-lyrical-rmw-fastrtps-cpp
  - ros-lyrical-moveit-msgs
  - ros-lyrical-sensor-msgs
  - ros-lyrical-nav-msgs
  - ros-lyrical-nav2-msgs
  - ros-lyrical-tf2-ros-py
  - ros-lyrical-ament-cmake
  - ros-lyrical-rosidl-default-generators
  - cmake
  - ninja
  - numpy>=2,<3
  - pip
  - pytest
  - pyyaml
  - pip:
      - PySide6>=6.8,<7
