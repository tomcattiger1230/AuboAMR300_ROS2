[project]
name = "auboamr300-local-dev"
version = "0.1.0"
description = "Local Python tooling for the Aubo AMR300 simulation workspace"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2,<3",
    "PySide6>=6.8,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
