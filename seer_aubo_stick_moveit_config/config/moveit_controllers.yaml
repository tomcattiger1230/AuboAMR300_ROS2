# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - main_base_controller
    - manipulator_controller
    - gripper_controller

  main_base_controller:
    type: FollowJointTrajectory
    joints:
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint
      - gripper1_joint
      - gripper2_joint
      - left_wheel_joint
      - right_wheel_joint
  manipulator_controller:
    type: FollowJointTrajectory
    joints:
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint
      - gripper1_joint
      - gripper2_joint
  gripper_controller:
    type: FollowJointTrajectory
    joints:
      - gripper1_joint
      - gripper2_joint